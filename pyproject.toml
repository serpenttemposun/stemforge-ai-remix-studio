[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemforge-ai-remix-studio"
version = "0.6.3"
description = "AI remix / stem separation generator — desktop studio for splitting any track into vocals, drums, bass, and instruments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StemForge contributors" }]
keywords = ["stem-separation", "ai-remix", "demucs", "mdx", "audio", "desktop"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "onnxruntime>=1.17",
    "PySide6>=6.6",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.1",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.17", "torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.10",
]

[project.scripts]
stemforge = "stemforge.bootstrap.app_entry:main"

[project.gui-scripts]
stemforge-gui = "stemforge.bootstrap.gui_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stemforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["stemforge/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"